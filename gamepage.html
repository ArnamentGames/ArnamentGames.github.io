<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playing Game | arnamentgames.github.io</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: sans-serif;
        background-color: #1c1c1c;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---- Top bar ---- */
      .game-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        background: #252525;
        border-bottom: 1px solid #3a3a3a;
        flex-shrink: 0;
        z-index: 5;
      }
      .game-header a.back {
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        background: #333333;
        border: 1px solid #4a4a4a;
        border-radius: 8px;
        padding: 6px 12px;
        flex-shrink: 0;
        transition: background 0.2s;
      }
      .game-header a.back:hover {
        background: #3d3d3d;
      }
      .game-header .game-title {
        font-size: 20px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      /* ---- Round blue-green fullscreen button ---- */
      #fs-btn {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        background: linear-gradient(135deg, #2196f3, #4caf50);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(33, 150, 243, 0.45);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      #fs-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(33, 150, 243, 0.6);
      }
      #fs-btn:active {
        transform: scale(0.95);
      }
      #fs-btn svg {
        width: 26px;
        height: 26px;
        pointer-events: none;
      }

      /* ---- Frame that holds the game ---- */
      .game-frame-wrap {
        /* --fsize keeps the frame a small square, sized to fit the viewport */
        --fsize: min(80vw, 80vh, 620px);
        flex: 1;
        min-height: 0;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .game-frame {
        width: var(--fsize);
        height: var(--fsize);
        flex-shrink: 0;
        border: 3px solid #3a3a3a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        background: #000000;
      }
      .game-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000000;
      }

      /* ---- Fullscreen (expanded) mode: iframe fills the whole page ---- */
      body.fullscreen {
        overflow: hidden;
      }
      body.fullscreen .game-header {
        display: none;
      }
      body.fullscreen .game-frame-wrap {
        padding: 0;
        --fsize: 100%;
        align-items: stretch;
      }
      body.fullscreen .game-frame {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      /* Big label sat next to the fullscreen button */
      .fs-cta {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      .fs-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 1px;
        white-space: nowrap;
        color: #dff1ff;
        text-shadow: 0 0 10px rgba(33, 150, 243, 0.55);
        user-select: none;
      }
      .fs-label .arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        line-height: 1;
        color: #4caf50;
        margin-top: -4px;
      }
      /* Everything hides while in fullscreen — the game takes over */
      body.fullscreen .fs-cta {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="game-header">
      <a class="back" href="/projects.html">&larr; All games</a>
      <span class="game-title" id="game-title">Loading…</span>
      <div class="fs-cta">
        <span class="fs-label">Fullscreen <span class="arrow" aria-hidden="true">➜</span></span>
        <button id="fs-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
        <svg id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6" />
          <path d="M9 21H3v-6" />
          <path d="M21 3l-7 7" />
          <path d="M3 21l7-7" />
        </svg>
      </button>
      </div>
    </div>
    <div class="game-frame-wrap">
      <div class="game-frame">
        <iframe id="game-iframe" title="Game" allowfullscreen></iframe>
      </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
      // ---------------------------------------------------------------------------------------
      // Games open already expanded (as if the fullscreen button had been pressed).
      // Flip START_IN_FULLSCREEN to false to go back to the small centered frame — that single
      // value is the whole change. The header is hidden while expanded, so leaving it means
      // refreshing the page, exactly as it was before.
      // ---------------------------------------------------------------------------------------
      var START_IN_FULLSCREEN = true;

      (function () {
        // Read which game to load from the URL (?game=<encoded path>)
        var params = new URLSearchParams(window.location.search);
        var game = params.get("game");

        var iframe = document.getElementById("game-iframe");
        var title = document.getElementById("game-title");
        var body = document.body;
        var btn = document.getElementById("fs-btn");

        if (!game) {
          title.textContent = "No game selected";
          iframe.src = "";
        } else {
          iframe.src = game;
          // Show the game folder name as the page title
          var clean = decodeURIComponent(game).replace(/\/index\.html$/, "").split("/").pop();
          title.textContent = clean || "Game";
          document.title = clean + " | arnamentgames.github.io";
        }

        function isFullscreen() {
          return body.classList.contains("fullscreen");
        }

        function setFullscreen(on) {
          body.classList.toggle("fullscreen", on);
        }

        btn.addEventListener("click", function () {
          setFullscreen(true);
        });

        if (START_IN_FULLSCREEN && game) {
          setFullscreen(true);
        }
      })();
    </script>
    <script>
    window.goatcounter = {
        path: function(p) { return location.host + p }
    }
</script>
<script data-goatcounter="https://wendellmeset.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script defer src="https://umami.shares.zrok.io/script.js" data-website-id="449e1284-4cb0-4d8e-b2ca-8c5b1cc35589"></script>
<script defer src="https://umami.shares.zrok.io/recorder.js" data-website-id="449e1284-4cb0-4d8e-b2ca-8c5b1cc35589"></script>
  </body>
</html>
